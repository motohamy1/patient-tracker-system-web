name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  visual-regression:
    needs: quality
    runs-on: ubuntu-latest
    # Playwright rendering depends on OS, browser build, fonts, and headless
    # mode, so baselines are environment artifacts. Generating them inside the
    # pinned image is what makes the suite meaningful. The browser directory is
    # deliberately NOT cached: Linux OS dependencies are not cacheable.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots=missing
      # Mandatory: --update-snapshots=missing silently creates absent baselines,
      # so without this gate a brand-new assertion could never fail CI.
      - name: Baseline drift gate
        run: git diff --exit-code tests/visual/__screenshots__
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7